services:
  degen-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: degen-sentinel
    init: true
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - FORCE_COLOR=1
      - COLUMNS=110
    tty: true
    stdin_open: true
    read_only: true
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
