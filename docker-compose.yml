services:
  degen-sentinel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: degen-sentinel
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - FORCE_COLOR=1
      - COLUMNS=110
    tty: true
    stdin_open: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
